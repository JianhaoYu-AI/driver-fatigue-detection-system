<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>疲劳检测系统 - 基于YOLO11</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            padding: 30px;
        }
        
        .upload-area {
            border: 3px dashed #007bff;
            border-radius: 15px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
        }
        
        .upload-area:hover {
            background: linear-gradient(45deg, #e9ecef, #dee2e6);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }
        
        .detection-result {
            margin-top: 20px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .fatigue-high {
            background: linear-gradient(135deg, #ffebee, #ffcdd2);
            border-left: 5px solid #f44336;
        }
        
        .fatigue-medium {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-left: 5px solid #ff9800;
        }
        
        .fatigue-low {
            background: linear-gradient(135deg, #e8f5e8, #c8e6c9);
            border-left: 5px solid #4caf50;
        }
        
        .video-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .stats-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px;
            padding: 20px;
            margin: 10px 0;
        }
        
        .detection-box {
            position: absolute;
            border: 2px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <h1 class="text-center mb-4">
                <i class="fas fa-eye text-primary"></i>
                疲劳检测系统
                <small class="text-muted">基于YOLO11深度学习</small>
            </h1>
            
            <div class="row">
                <!-- 图片检测区域 -->
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-image"></i>
                                图片检测
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                                <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-primary"></i>
                                <h5>点击或拖拽上传图片</h5>
                                <p class="text-muted">支持 JPG、PNG、BMP 格式</p>
                                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                            </div>
                            
                            <div class="loading" id="imageLoading">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">检测中...</span>
                                </div>
                                <p class="mt-2">正在分析图片...</p>
                            </div>
                            
                            <div id="imageResults" class="mt-3"></div>
                        </div>
                    </div>
                </div>
                
                <!-- 实时监控区域 -->
                <div class="col-md-6 mb-4">
                    <div class="card h-100">
                        <div class="card-header bg-success text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-video"></i>
                                实时监控
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="video-container">
                                <img id="videoStream" src="" style="width: 100%; height: 300px; object-fit: cover; display: none;" alt="实时视频">
                                <div id="videoPlaceholder" class="text-center py-5">
                                    <i class="fas fa-video fa-3x text-muted mb-3"></i>
                                    <h5>摄像头未启动</h5>
                                    <p class="text-muted">点击下方按钮开始监控</p>
                                </div>
                            </div>
                            
                            <div class="mt-3">
                                <button class="btn btn-success" onclick="startCamera()">
                                    <i class="fas fa-play"></i> 启动监控
                                </button>
                                <button class="btn btn-danger" onclick="stopCamera()">
                                    <i class="fas fa-stop"></i> 停止监控
                                </button>
                            </div>
                            
                            <div id="cameraResults" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 统计信息 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header bg-info text-white">
                            <h5 class="mb-0">
                                <i class="fas fa-chart-bar"></i>
                                检测统计
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-3">
                                    <div class="stats-card text-center">
                                        <h3 id="totalDetections">0</h3>
                                        <p>总检测次数</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stats-card text-center">
                                        <h3 id="fatigueEvents">0</h3>
                                        <p>疲劳事件</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stats-card text-center">
                                        <h3 id="currentStatus">正常</h3>
                                        <p>当前状态</p>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="stats-card text-center">
                                        <h3 id="perclosValue">0%</h3>
                                        <p>PERCLOS值</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 检测结果详情 -->
            <div id="detectionDetails" class="mt-4" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-list"></i>
                            检测详情
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="detectionList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script>
        let cameraActive = false;
        let statsInterval;

        // 图片上传检测
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                uploadAndDetect(file);
            }
        });

        function uploadAndDetect(file) {
            const formData = new FormData();
            formData.append('image', file);
            
            // 显示加载状态
            document.getElementById('imageLoading').style.display = 'block';
            document.getElementById('imageResults').innerHTML = '';
            
            fetch('/detect', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('imageLoading').style.display = 'none';
                displayImageResults(data);
                updateStats();
            })
            .catch(error => {
                document.getElementById('imageLoading').style.display = 'none';
                document.getElementById('imageResults').innerHTML = 
                    '<div class="alert alert-danger">检测失败: ' + error.message + '</div>';
            });
        }

        function displayImageResults(data) {
            const resultsDiv = document.getElementById('imageResults');
            
            if (data.success) {
                let html = '<div class="detection-result">';
                
                if (data.fatigue_result) {
                    const level = data.fatigue_result.fatigue_level;
                    const levelClass = 'fatigue-' + level;
                    const statusText = data.fatigue_result.is_fatigue ? '疲劳' : '正常';
                    
                    html += `<div class="${levelClass}">
                        <h6><i class="fas fa-exclamation-triangle"></i> 疲劳状态: ${statusText}</h6>
                        <p>PERCLOS值: ${(data.fatigue_result.perclos * 100).toFixed(1)}%</p>
                    </div>`;
                }
                
                html += `<p><i class="fas fa-search"></i> 检测到 ${data.count} 个目标</p>`;
                html += '</div>';
                
                resultsDiv.innerHTML = html;
            } else {
                resultsDiv.innerHTML = '<div class="alert alert-danger">检测失败</div>';
            }
        }

        // 摄像头控制
        function startCamera() {
            if (cameraActive) return;
            
            fetch('/start_camera')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    cameraActive = true;
                    document.getElementById('videoStream').style.display = 'block';
                    document.getElementById('videoPlaceholder').style.display = 'none';
                    document.getElementById('videoStream').src = '/video_feed';
                    
                    // 开始更新统计
                    statsInterval = setInterval(updateStats, 2000);
                } else {
                    alert('启动摄像头失败: ' + data.error);
                }
            });
        }

        function stopCamera() {
            if (!cameraActive) return;
            
            fetch('/stop_camera')
            .then(response => response.json())
            .then(data => {
                cameraActive = false;
                document.getElementById('videoStream').style.display = 'none';
                document.getElementById('videoPlaceholder').style.display = 'block';
                document.getElementById('videoStream').src = '';
                
                if (statsInterval) {
                    clearInterval(statsInterval);
                }
            });
        }

        // 更新统计信息
        function updateStats() {
            fetch('/stats')
            .then(response => response.json())
            .then(data => {
                document.getElementById('totalDetections').textContent = data.total_detections;
                document.getElementById('fatigueEvents').textContent = data.fatigue_events;
                
                if (data.recent_history && data.recent_history.length > 0) {
                    const latest = data.recent_history[data.recent_history.length - 1];
                    document.getElementById('currentStatus').textContent = latest.is_fatigue ? '疲劳' : '正常';
                    document.getElementById('perclosValue').textContent = (latest.perclos * 100).toFixed(1) + '%';
                }
            });
        }

        // 拖拽上传
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'linear-gradient(45deg, #e3f2fd, #bbdefb)';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = 'linear-gradient(45deg, #f8f9fa, #e9ecef)';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = 'linear-gradient(45deg, #f8f9fa, #e9ecef)';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadAndDetect(files[0]);
            }
        });

        // 页面加载时更新统计
        updateStats();
    </script>
</body>
</html>
